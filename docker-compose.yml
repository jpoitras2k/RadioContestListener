version: '3.8'

services:
  radio-listener:
    build: .
    container_name: zone-radio-listener
    restart: unless-stopped
    ports:
      - "4173:4173"
    environment:
      - PORT=4173
      - HOST=0.0.0.0
      - AUDIO_SOURCE=stream
      - DISCORD_ENABLED=true
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - PUSHOVER_ENABLED=false
      - WHISPER_MODEL_SIZE=distil-large-v3
      - WHISPER_DEVICE=cpu
